<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>N5 Kanji Revision</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--surf:#fff;--ink:#16213a;--mute:#5d6882;--line:#cfd6e4;--acc:#2b4a99;--onacc:#fff;--ok:#1d7a4d;--okbg:#dff3e8;--bad:#b3352f;--badbg:#fbe3e1;--guide:#c9d2e6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1526;--surf:#18203a;--ink:#e8ecf7;--mute:#9aa6c4;--line:#2c3758;--acc:#8fa8f0;--onacc:#0f1526;--ok:#6fd6a0;--okbg:#17372a;--bad:#ff8f87;--badbg:#42201f;--guide:#2c3758}}
:root[data-theme="dark"]{--bg:#0f1526;--surf:#18203a;--ink:#e8ecf7;--mute:#9aa6c4;--line:#2c3758;--acc:#8fa8f0;--onacc:#0f1526;--ok:#6fd6a0;--okbg:#17372a;--bad:#ff8f87;--badbg:#42201f;--guide:#2c3758}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-family:"Shippori Mincho","Hiragino Mincho ProN",serif;font-size:1.7rem;margin:0 0 4px}
h2{font-size:1.05rem;margin:22px 0 8px}
p.sub{color:var(--mute);margin:0 0 8px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surf);color:var(--ink);padding:10px 14px}
button:focus-visible,input:focus-visible+label{outline:3px solid var(--acc);outline-offset:2px}
button.pri{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:700}
button.pri:disabled{opacity:.4;cursor:not-allowed}
button.sm{padding:6px 10px;font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chk input{position:absolute;opacity:0;pointer-events:none}
.chk label{display:block;border:1px solid var(--line);background:var(--surf);border-radius:8px;padding:10px 12px;cursor:pointer}
.chk label small{display:block;color:var(--mute)}
.chk input:checked+label{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--surf))}
.opts{display:flex;flex-direction:column;gap:8px}
.cnt{display:flex;gap:8px;align-items:center}
.cnt button{padding:6px 12px}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:.9rem}
.prog{height:6px;background:var(--line);border-radius:3px;margin:8px 0 16px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);width:0}
.box{width:min(220px,60vw);aspect-ratio:1;margin:8px auto 4px;border:2px solid var(--ink);display:grid;place-items:center;position:relative;background:var(--surf)}
.box::before,.box::after{content:"";position:absolute;background:var(--guide)}
.box::before{left:50%;top:0;bottom:0;width:1px}.box::after{top:50%;left:0;right:0;height:1px}
.box span{position:relative;z-index:1;font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:700;font-size:min(130px,34vw);line-height:1}
.box.word span{font-size:min(54px,13vw);text-align:center;padding:8px;word-break:break-all}
.box.word{aspect-ratio:auto;min-height:130px;width:min(420px,100%)}
.qtxt{text-align:center;color:var(--mute);margin:8px 0 16px}
.o{text-align:left;font-size:1.15rem;padding:14px 16px;width:100%}
.o.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:700}
.o.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.fb{margin:14px 0;padding:12px;border-radius:8px;background:var(--surf);border:1px solid var(--line)}
.fb b.ok{color:var(--ok)}.fb b.bad{color:var(--bad)}
.score{font-family:"Shippori Mincho",serif;font-size:3rem;font-weight:700;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:.95rem}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.scroll{overflow-x:auto}
.hide{display:none}
@media (prefers-reduced-motion:no-preference){.prog i{transition:width .25s}}
</style></head><body><main>
<section id="setup">
<h1>N5 漢字 revision</h1>
<p class="sub">Pick chapters and question types. <span id="avail"></span></p>
<h2>Chapters</h2>
<div class="bar"><button class="sm" id="all">Select all</button><button class="sm" id="none">Clear</button></div>
<div class="grid chk" id="chaps"></div>
<h2>Question types</h2>
<div class="grid chk" id="types"></div>
<h2>Number of questions</h2>
<div class="cnt"><button id="dec" aria-label="Fewer">−</button><b id="n">20</b><button id="inc" aria-label="More">+</button><button class="sm" id="max">All available</button></div>
<div class="bar" style="margin-top:24px"><button class="pri" id="start" disabled>Start quiz</button></div>
</section>
<section id="quiz" class="hide">
<div class="meta"><span id="qn"></span><span id="sc"></span></div>
<div class="prog"><i id="pb"></i></div>
<div class="box" id="box"><span id="big"></span></div>
<p class="qtxt" id="qtxt"></p>
<div class="opts" id="opts"></div>
<div class="fb hide" id="fb" aria-live="polite"></div>
<div class="bar"><button class="pri hide" id="next">Next</button><button class="sm" id="quit">End quiz</button></div>
</section>
<section id="result" class="hide">
<h1>Results</h1>
<div class="score" id="rs"></div>
<p class="sub" id="rt"></p>
<div class="bar"><button class="pri" id="again">New quiz</button><button id="retry">Retry mistakes</button></div>
<h2>Mistakes</h2>
<div class="scroll"><table id="mt"></table></div>
</section>
</main>

const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let N=20,pool=[],qs=[],qi=0,score=0,wrong=[],locked=false;
DATA.forEach((c,i)=>{$("chaps").insertAdjacentHTML("beforeend",`<div><input type="checkbox" id="c${i}" value="${i}"><label for="c${i}">${c.label}<small>${c.items.length} kanji</small></label></div>`)});
TYPES.forEach(t=>{$("types").insertAdjacentHTML("beforeend",`<div><input type="checkbox" id="t_${t.id}" value="${t.id}" checked><label for="t_${t.id}">${t.t}<small>${t.d}</small></label></div>`)});
const selC=()=>[...document.querySelectorAll("#chaps input:checked")].map(x=>+x.value);
const selT=()=>[...document.querySelectorAll("#types input:checked")].map(x=>x.value);
function items(ci){return ci.flatMap(i=>DATA[i].items)}
function build(ci,ts){
  const it=items(ci),out=[];
  it.forEach(k=>{
    if(ts.includes("meaning")&&k.m)out.push({t:"meaning",k:k.k,a:k.m});
    if(ts.includes("on")&&k.on)out.push({t:"on",k:k.k,a:k.on});
    if(ts.includes("kun")&&k.kun)out.push({t:"kun",k:k.k,a:k.kun});
    if(ts.includes("vocab"))k.v.forEach(v=>out.push({t:"vocab",k:v[0],a:v[1],m:v[2]||""}));
  });return out;
}
function refresh(){
  const c=selC(),t=selT();pool=build(c,t);
  $("avail").textContent=pool.length?`${pool.length} questions available.`:"";
  $("start").disabled=!pool.length;
  if(N>pool.length&&pool.length)N=pool.length;$("n").textContent=N;
}
document.querySelectorAll("#chaps input,#types input").forEach(x=>x.onchange=refresh);
$("all").onclick=()=>{document.querySelectorAll("#chaps input").forEach(x=>x.checked=true);refresh()};
$("none").onclick=()=>{document.querySelectorAll("#chaps input").forEach(x=>x.checked=false);refresh()};
$("dec").onclick=()=>{N=Math.max(1,N-5);$("n").textContent=N};
$("inc").onclick=()=>{N=Math.min(pool.length||N,N+5);$("n").textContent=N};
$("max").onclick=()=>{if(pool.length){N=pool.length;$("n").textContent=N}};
function show(id){["setup","quiz","result"].forEach(s=>$(s).classList.toggle("hide",s!==id));window.scrollTo(0,0)}
function begin(list){qs=shuf(list).slice(0,N);qi=0;score=0;wrong=[];show("quiz");ask()}
$("start").onclick=()=>{refresh();if(pool.length)begin(pool)};
// distractors come from the chapters being quizzed, topping up from all chapters if needed
function distract(q,n){
  const all=[...new Set(build(selC(),[q.t]).filter(x=>x.t===q.t).map(x=>x.a))].filter(a=>a!==q.a);
  let d=shuf(all).slice(0,n);
  if(d.length<n){const ext=[...new Set(build(DATA.map((_,i)=>i),[q.t]).map(x=>x.a))].filter(a=>a!==q.a&&!d.includes(a));d=d.concat(shuf(ext).slice(0,n-d.length))}
  return d;
}
function ask(){
  const q=qs[qi];locked=false;
  $("qn").textContent=`Question ${qi+1} of ${qs.length}`;$("sc").textContent=`Score ${score}`;
  $("pb").style.width=(qi/qs.length*100)+"%";
  $("box").classList.toggle("word",q.t==="vocab");$("big").textContent=q.k;
  $("qtxt").textContent={meaning:"What does this kanji mean?",on:"Choose the onyomi (音読み)",kun:"Choose the kunyomi (訓読み)",vocab:"Choose the correct reading"}[q.t];
  const o=shuf([q.a,...distract(q,3)]);
  $("opts").innerHTML="";
  o.forEach(t=>{const b=document.createElement("button");b.className="o";b.textContent=t;b.onclick=()=>pick(b,t);$("opts").appendChild(b)});
  $("fb").classList.add("hide");$("next").classList.add("hide");
}
function pick(b,t){
  if(locked)return;locked=true;const q=qs[qi],ok=t===q.a;
  if(ok)score++;else wrong.push(q);
  [...$("opts").children].forEach(x=>{if(x.textContent===q.a)x.classList.add("ok");x.disabled=true});
  if(!ok)b.classList.add("bad");
  const extra=q.t==="vocab"?(q.m?` — ${q.m}`:""):"";
  $("fb").innerHTML=ok?`<b class="ok">Correct.</b> ${q.k} = ${q.a}${extra}`:`<b class="bad">Not quite.</b> ${q.k} = ${q.a}${extra}`;
  $("fb").classList.remove("hide");$("sc").textContent=`Score ${score}`;
  $("next").textContent=qi===qs.length-1?"See results":"Next";$("next").classList.remove("hide");$("next").focus();
}
$("next").onclick=()=>{if(qi<qs.length-1){qi++;ask()}else finish()};
$("quit").onclick=()=>{if(locked||qi>0){qs=qs.slice(0,qi+(locked?1:0));finish()}else show("setup")};
function finish(){
  const n=qs.length||1;$("rs").textContent=`${score} / ${qs.length}`;
  $("rt").textContent=`${Math.round(score/n*100)}% correct`;
  const L={meaning:"Meaning",on:"Onyomi",kun:"Kunyomi",vocab:"Reading"};
  $("mt").innerHTML=wrong.length?`<tr><th>Item</th><th>Type</th><th>Answer</th></tr>`+wrong.map(q=>`<tr><td>${q.k}</td><td>${L[q.t]}</td><td>${q.a}${q.t==="vocab"&&q.m?"<br><small>"+q.m+"</small>":""}</td></tr>`).join(""):`<tr><td>No mistakes. 全部正解!</td></tr>`;
  $("retry").classList.toggle("hide",!wrong.length);
  show("result");
}
$("again").onclick=()=>{show("setup");refresh()};
$("retry").onclick=()=>{const w=wrong.slice();N=w.length;begin(w)};
refresh();
</script></body></html>
